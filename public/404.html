<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QuoteGen CRM</title>
    <script>
      // GitHub Pages SPA redirect: preserve the path + query + hash
      // by storing it in sessionStorage and redirecting to index.html
      var l = window.location;
      sessionStorage.redirect = l.pathname.replace('/Lead-Handler', '') + l.search + l.hash;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/Lead-Handler/');
    </script>
  </head>
  <body></body>
</html>
